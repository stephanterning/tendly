name: Publish images
on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-${{ github.sha }}
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  images:
    needs: verify
    runs-on: ubuntu-latest
    # Serialize each package's writes, including version aliases across commits.
    concurrency:
      group: publish-image-${{ github.repository }}-${{ matrix.target }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        target: [api, worker, web]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Preserve the existing commit image
        id: image
        env:
          IMAGE: ghcr.io/${{ github.repository }}-${{ matrix.target }}
        shell: bash
        run: |
          image="${IMAGE,,}"
          echo "name=$image" >> "$GITHUB_OUTPUT"
          echo "existing=$(sh infrastructure/scripts/image-digest.sh "$image:sha-$GITHUB_SHA")" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        if: steps.image.outputs.existing == ''
        with:
          context: .
          file: infrastructure/docker/Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Preserve version tags and record the digest
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          version=""
          if [ "$GITHUB_REF_TYPE" = tag ]; then version="$GITHUB_REF_NAME"; fi
          sh infrastructure/scripts/publish-version.sh "$IMAGE" "$GITHUB_SHA" "$version" >> "$GITHUB_STEP_SUMMARY"

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Create versioned GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" --json tagName >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes
          fi
