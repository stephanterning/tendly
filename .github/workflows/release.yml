name: Publish release images

on:
  release:
    types: [published, released]

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag the existing images without rebuilding
        env:
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9][A-Za-z0-9.-]*)?$ ]] || [ "${#VERSION}" -gt 128 ]; then
            echo 'Use a version such as v1.2.3 or v1.2.3-rc.1.' >&2
            exit 1
          fi
          image_prefix=$(printf 'ghcr.io/%s' "$REPOSITORY" | tr '[:upper:]' '[:lower:]')
          # Check the whole set before writing any release tag.
          for target in api worker web; do
            image="$image_prefix-$target"
            digest=$(sh infrastructure/scripts/image-digest.sh "$image:sha-$GITHUB_SHA")
            if [ -z "$digest" ]; then
              echo "No published commit image for $target. Wait for branch CI, then re-run this job." >&2
              exit 1
            fi
            existing=$(sh infrastructure/scripts/image-digest.sh "$image:$VERSION")
            if [ -n "$existing" ] && [ "$existing" != "$digest" ]; then
              echo "The release tag for $target already points to a different image. Publish a new version." >&2
              exit 1
            fi
          done
          for target in api worker web; do
            sh infrastructure/scripts/publish-version.sh "$image_prefix-$target" "$GITHUB_SHA" "$VERSION" >> "$GITHUB_STEP_SUMMARY"
          done
