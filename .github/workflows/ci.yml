name: CI
on:
  workflow_call:
  push:
    branches: [main, 'codex/**']
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: tendly
          POSTGRES_PASSWORD: integration-only
          POSTGRES_DB: tendly_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U tendly -d tendly_test" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://tendly:integration-only@localhost:5432/tendly_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm api:generate
      - run: git diff --exit-code -- packages/shared/openapi.json packages/shared/src/generated/api.ts
      - run: pnpm check
      - run: pnpm test:integration
  containers:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: container-integration-only
      PUBLIC_ORIGIN: https://tendly.example.com
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build --wait --wait-timeout 180
      - run: bash infrastructure/scripts/container-smoke.sh
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down --volumes
